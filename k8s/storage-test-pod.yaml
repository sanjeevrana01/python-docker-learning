apiVersion: v1
kind: Pod
metadata:
  name: storage-test-pod
spec:
  containers:
    - name: storage-test
      image: busybox:1.36
      command:
        [
          "sh",
          "-c",
          "echo 'Hello from Kubernetes persistent storage!' > /data/test.txt && sleep 3600",
        ]
      volumeMounts:
        - name: student-volume
          mountPath: /data
  volumes:
    - name: student-volume
      persistentVolumeClaim:
        claimName: student-storage
