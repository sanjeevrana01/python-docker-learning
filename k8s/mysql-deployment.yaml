apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-mysql-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-mysql-k8s
  template:
    metadata:
      labels:
        app: student-mysql-k8s
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-k8s-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: student_db
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-data
