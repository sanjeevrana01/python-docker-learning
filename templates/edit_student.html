
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student | Student Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a class="brand" href="/">🎓 Student Management</a>
        <nav>
            <a href="/">Home</a>
            <a href="/students">Students</a>
            <a href="/about">About</a>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-heading">
            <span class="eyebrow">STUDENT RECORDS</span>
            <h1>Edit Student</h1>
            <p>Update the student's information below.</p>
        </div>

        <section class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ student.name }}"
                        placeholder="Enter full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ student.email }}"
                        placeholder="student@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input
                        type="text"
                        id="course"
                        name="course"
                        value="{{ student.course or '' }}"
                        placeholder="Enter course"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" class="button-primary">
                        Save Changes
                    </button>
                    <a href="/students" class="button-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </section>

        <p class="form-note">Changes will be saved to the student database.</p>
    </main>
</body>
</html>
